
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docpilot_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      EMBEDDER_TYPE: gemini
    volumes:
      - ./backend/data:/app/data
      - ./backend/.cache:/app/.cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docpilot_frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
